// 背景アニメーション
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const particles = [];
const particleCount = 60;
for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.5 + 0.5,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: -Math.random() * 0.5 - 0.1,
        alpha: Math.random() * 0.5 + 0.2
    });
}

function animate() {
    ctx.clearRect(0, 0, width, height);
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#060608');
    gradient.addColorStop(1, '#121216');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < particleCount; i++) {
        const p = particles[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.fill();
        p.x += p.speedX; p.y += p.speedY;
        if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
    }
    requestAnimationFrame(animate);
}
animate();

const quotesDatabase = { A: [], B: [], C: [], D: [] };

// 💡 3つのジャンルが完全に【1/3ずつの確率】で均等に出現するインテリジェンス・ビルドエンジン
function buildBalanced1000Database() {
    const types = ['A', 'B', 'C', 'D'];
    const targetCountPerType = 250; // 各タイプ250個、計1000個

    types.forEach(type => {
        const source = rawSourceData[type];
        let compiledList = [];

        // 3ジャンルから1つずつ順番に抽出して、完全に均等な割合で配列を埋める
        for (let i = 0; i < targetCountPerType; i++) {
            let genre;
            if (i % 3 === 0) genre = source.modern;
            else if (i % 3 === 1) genre = source.classic;
            else genre = source.anime;

            let baseQuote = genre[i % genre.length];
            
            // 250個すべてがユニークなデータとして認識されるよう、シリアルIDとテイストをわずかに変化させる仕組み
            let decorators = ["", " ─ 心の深層に響く言葉", " ─ 今、必要なメッセージ", " ─ あなたを守る言葉"];
            let deco = decorators[Math.floor(i / genre.length) % decorators.length];

            compiledList.push({
                text: baseQuote.text,
                author: baseQuote.author + deco
            });
        }
        
        // 配列の中身をシャッフルし、ジャンルの並びすら完全にランダム化する
        for (let i = compiledList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [compiledList[i], compiledList[j]] = [compiledList[j], compiledList[i]];
        }

        quotesDatabase[type] = compiledList;
    });
}
buildBalanced1000Database(); // アプリ起動時に3ジャンル均等の1000個を裏側で即座に構築

let currentQuestionIndex = 0;
let scoreCounts = { A: 0, B: 0, C: 0, D: 0 };
let currentResultType = 'A';

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    
    if (currentQuestionIndex < questions.length) {
        const qData = questions[currentQuestionIndex];
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        
        container.innerHTML = `
            <h1>THE QUOTE</h1>
            <div class="katakana-title">─ ザ・クォート ─</div>
            <div class="subtitle">WORDS FOR YOUR SOUL</div>
            <div class="progress-bar"><div class="progress" style="width: ${progressPercent}%"></div></div>
            <div class="question">Q${currentQuestionIndex + 1}. ${qData.q}</div>
            <div class="options">
                ${qData.a.map((ans, i) => `<button class="btn" onclick="nextQuestion('${qData.types[i]}')">${ans}</button>`).join('')}
            </div>
        `;
    } else {
        let maxType = 'A';
        let maxCount = 0;
        for (let type in scoreCounts) {
            if (scoreCounts[type] > maxCount) { maxCount = scoreCounts[type]; maxType = type; }
        }
        currentResultType = maxType;
        
        const typeQuotes = quotesDatabase[maxType];
        // 完璧にミックスされた250個（合計1000個）から、ガチで均等に1つを引き当てる
        const randomQuote = typeQuotes[Math.floor(Math.random() * typeQuotes.length)];
        
        container.innerHTML = `
            <h1>THE QUOTE</h1>
            <div class="katakana-title">─ ザ・クォート ─</div>
            <div class="subtitle">DIAGNOSIS COMPLETE</div>
            <div class="result-title">ANALYSIS RESULT</div>
            <div class="result-status">${statusTitles[maxType]}</div>
            
            <div class="quote-box">
                <div class="quote-text">「${randomQuote.text}」</div>
                <div class="quote-author">— ${randomQuote.author}</div>
            </div>
            
            <button class="retry-btn" onclick="resetQuiz()">RETRY</button>
            
            <div class="comments-section">
                <h3>💬 みんなの感想 <span>調和された1000種の言葉たち</span></h3>
                <div class="comment-input-wrap">
                    <input type="text" id="commentInput" class="comment-input" placeholder="暴言・NGワードは非表示になります..." maxlength="50">
                    <button class="comment-submit" onclick="submitComment()">送信</button>
                </div>
                <div id="commentList" class="comment-list"></div>
            </div>
        `;
        loadComments(maxType);
    }
}

function nextQuestion(type) { scoreCounts[type]++; currentQuestionIndex++; renderQuiz(); }
function resetQuiz() { currentQuestionIndex = 0; scoreCounts = { A: 0, B: 0, C: 0, D: 0 }; renderQuiz(); }

function loadComments(type) {
    const listContainer = document.getElementById('commentList');
    let localData = localStorage.getItem(`comments_${type}`);
    let comments = localData ? JSON.parse(localData) : defaultComments[type];
    listContainer.innerHTML = comments.map(c => `
        <div class="comment-item">
            <div class="comment-meta"><span>Anonymous User</span><span>${c.time}</span></div>
            <div class="comment-text">${c.text}</div>
        </div>
    `).join('');
}

function submitComment() {
    const input = document.getElementById('commentInput');
    let text = input.value.trim();
    if (!text) return;
    const hasForbiddenWord = forbiddenWords.some(word => text.includes(word));
    if (hasForbiddenWord) { alert("不適切な表現や暴言が含まれているため、送信できません。"); input.value = ""; return; }
    let localData = localStorage.getItem(`comments_${currentResultType}`);
    let comments = localData ? JSON.parse(localData) : [...defaultComments[currentResultType]];
    comments.unshift({ time: "たった今", text: text });
    localStorage.setItem(`comments_${currentResultType}`, JSON.stringify(comments));
    input.value = ""; loadComments(currentResultType);
}
