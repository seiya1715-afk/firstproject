<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE QUOTE ─ 今のあなたを言語化する、言葉の処方箋</title>
    <style>
        :root {
            --card-bg: rgba(15, 15, 20, 0.65);
            --card-border: rgba(255, 255, 255, 0.06);
            --primary-color: #3b82f6;  
            --text-color: #f4f4f5;     
            --sub-text: #71717a;       
            --accent-color: #f43f5e;   
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #030303;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            letter-spacing: 0.06em;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景のアニメーションキャンバス */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 45px 35px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 { 
            font-size: 2.2rem; 
            font-weight: 900; 
            margin: 0 0 8px 0; 
            color: var(--text-color); 
            letter-spacing: 0.25em;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--sub-text);
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            box-shadow: 0 0 12px var(--primary-color);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question { 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 35px; 
            text-align: left; 
            line-height: 1.8;
            color: #e4e4e7;
        }

        .options { display: flex; flex-direction: column; gap: 14px; }

        .btn {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #d4d4d8;
            padding: 18px 22px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.95rem;
            text-align: left;
            line-height: 1.5;
            transition: all 0.25s ease;
        }

        .btn:hover {
            background: rgba(59, 130, 246, 0.06);
            border-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
            transform: translateY(-1px);
        }

        .result-title { font-size: 0.8rem; color: var(--sub-text); margin-bottom: 8px; letter-spacing: 0.2em; }
        .result-status { font-size: 1.6rem; font-weight: 800; color: var(--accent-color); margin-bottom: 40px; letter-spacing: 0.05em; }
        
        .quote-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 2px solid var(--primary-color);
            padding: 30px 25px;
            margin-bottom: 40px;
            text-align: left;
            border-radius: 0 14px 14px 0;
            box-shadow: inset 5px 0 30px rgba(0,0,0,0.3);
        }
        
        .quote-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; line-height: 1.8; color: #ffffff; }
        .quote-author { font-size: 0.85rem; color: var(--sub-text); text-align: right; font-style: italic; }
        
        .retry-btn {
            background: var(--text-color);
            color: #000000;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.1em;
            transition: all 0.2s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .retry-btn:hover {
            background: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 12px 30px rgba(255,255,255,0.15);
        }

        .ad-space {
            margin-top: 45px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(255, 255, 255, 0.04);
            font-size: 0.75rem;
            color: #52525b;
            border-radius: 12px;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

<!-- 動く背景用のキャンバス -->
<canvas id="bg-canvas"></canvas>

<div class="container" id="quiz-container">
    <!-- JavaScriptで動的に入ります -->
</div>

<script>
// 背景のアニメーションロジック（粒子エフェクト）
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const particles = [];
const particleCount = 60; // 粒子の数

for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.5 + 0.5,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: -Math.random() * 0.5 - 0.1, // 上に向かって静かに流れる
        alpha: Math.random() * 0.5 + 0.2
    });
}

function animate() {
    ctx.clearRect(0, 0, width, height);
    
    // 深みのあるグラデーションのベース
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#060608');
    gradient.addColorStop(1, '#121216');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    // 粒子を描画して動かす
    for (let i = 0; i < particleCount; i++) {
        const p = particles[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.fill();

        p.x += p.speedX;
        p.y += p.speedY;

        // 画面外に出たら下からリスポーン
        if (p.y < -10) {
            p.y = height + 10;
            p.x = Math.random() * width;
        }
        if (p.x < -10 || p.x > width + 10) {
            p.x = Math.random() * width;
        }
    }
    requestAnimationFrame(animate);
}
animate();


// クイズのデータ
const questions = [
    { q: "今のあなたの「HP（残りエネルギー）」をスマホの充電に例えると？", a: ["80%以上！まだまだ余裕で動ける", "20%以下…早く家で充電（帰宅）したい", "50%前後。色々と考えて頭が重い感じ", "充電マークは緑だけど、実は低電力モード"], types: ["A", "B", "C", "D"] },
    { q: "目の前に「1時間、完全に自由に使える空き時間」ができたら？", a: ["やりたかった趣味や作業を進める", "ベッドに倒れ込んでSNSをぼーっと眺める", "今後のスケジュールや仕事の整理をする", "美味しいものを食べるか、お風呂にこもる"], types: ["A", "B", "C", "D"] },
    { q: "SNSを見ていて、なんとなく「モヤッ」とする瞬間は？", a: ["周りがどんどん成果を出して焦るとき", "みんな楽しそうで、自分の日常が地味に見えるとき", "色んな人の愚痴や議論が目に入ってくるとき", "「いいね」の数がなんとなく気になるとき"], types: ["A", "B", "C", "D"] },
    { q: "友達から「最近ちょっと疲れてない？」と心配されたら？", a: ["「全然！めっちゃ元気！」と笑顔で返す", "「そうなの、実は最近バタバタで…」とこぼす", "「え、そんな風に見える？」と理由を気にする", "「大丈夫だよ〜」と笑って話を流す"], types: ["A", "B", "C", "D"] },
    { q: "今、一番「言われたら嬉しい言葉」はどれ？", a: ["「君なら絶対にできるよ！」（応援）", "「もう十分がんばったから休みな」（甘やかし）", "「焦らなくていい、マイペースでいこう」（安心）", "「いつも本当にありがとう」（感謝・肯定）"], types: ["A", "B", "C", "D"] }
];

const quotesDatabase = {
    A: [
        { text: "行動の動機が純粋であれば、結果を恐れる必要はない。", author: "マハトマ・ガンジー" },
        { text: "最大の危険は、目標が高すぎて失敗することではなく、低すぎる目標を達成することだ。", author: "ミケランジェロ" },
        { text: "世界を変えたいなら、まず自分がその変化になりなさい。", author: "ガンジー" }
    ],
    B: [
        { text: "休むことは、次の前進のための準備である。", author: "アントニー・チェーホフ" },
        { text: "何もしない時間を作ることは、心を耕すことと同じだ。", author: "ゲーテ" },
        { text: "飛べないなら走りなさい。走れないなら歩きなさい。歩けないなら這いなさい。とにかく前へ。", author: "キング牧師" }
    ],
    C: [
        { text: "明日は明日、今日は今日。悩んだって始まらないさ。", author: "スナフキン" },
        { text: "未来を予知する最良の方法は、未来を創ることだ。", author: "ピーター・ドラッカー" },
        { text: "心に迷いがあるときは、一番シンプルな道を選びなさい。", author: "アリストテレス" }
    ],
    D: [
        { text: "自分を愛することは、一生続くロマンスの始まりだ。", author: "オスカー・ワイルド" },
        { text: "誰もが完璧ではない。だから鉛筆には消しゴムがついているんだ。", author: "ウォルフ・ガング" },
        { text: "他人の目を気にするな。彼らは君のことなど大して考えていない。", author: "ココ・シャネル" }
    ]
};

const statusTitles = {
    A: "ENERGY // 前編モード",
    B: "RECOVERY // 省エネ休息モード",
    C: "THINKING // 深呼吸モヤモヤモード",
    D: "POKERFACE // がんばり屋モード"
};

let currentQuestionIndex = 0;
let scoreCounts = { A: 0, B: 0, C: 0, D: 0 };

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    
    if (currentQuestionIndex < questions.length) {
        const qData = questions[currentQuestionIndex];
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        
        container.innerHTML = `
            <h1>THE QUOTE</h1>
            <div class="subtitle">WORDS FOR YOUR SOUL</div>
            <div class="progress-bar"><div class="progress" style="width: ${progressPercent}%"></div></div>
            <div class="question">Q${currentQuestionIndex + 1}. ${qData.q}</div>
            <div class="options">
                ${qData.a.map((ans, i) => `<button class="btn" onclick="nextQuestion('${qData.types[i]}')">${ans}</button>`).join('')}
            </div>
            
            <!-- 【広告枠：クイズ途中】 -->
            <div class="ad-space">
                <span style="color:#3f3f46; display:block; margin-bottom:5px; font-weight:700; letter-spacing:0.1em;">SPONSOR LINK</span>
                <span style="color:#52525b;">ここにGoogle AdSense等の広告が入ります</span>
            </div>
        `;
    } else {
        let maxType = 'A';
        let maxCount = 0;
        for (let type in scoreCounts) {
            if (scoreCounts[type] > maxCount) {
                maxCount = scoreCounts[type];
                maxType = type;
            }
        }
        
        const typeQuotes = quotesDatabase[maxType];
        const randomQuote = typeQuotes[Math.floor(Math.random() * typeQuotes.length)];
        
        container.innerHTML = `
            <h1>THE QUOTE</h1>
            <div class="subtitle">DIAGNOSIS COMPLETE</div>
            <div class="result-title">ANALYSIS RESULT</div>
            <div class="result-status">${statusTitles[maxType]}</div>
            
            <div class="quote-box">
                <div class="quote-text">「${randomQuote.text}」</div>
                <div class="quote-author">— ${randomQuote.author}</div>
            </div>
            
            <p style="font-size:0.75rem; color:var(--sub-text); margin-bottom:30px;">※言葉はあなたの運気で変化します。また明日もお越しください。</p>
            <button class="retry-btn" onclick="resetQuiz()">RETRY</button>
            
            <!-- 【広告枠：結果画面】 -->
            <div class="ad-space">
                <span style="color:#3f3f46; display:block; margin-bottom:5px; font-weight:700; letter-spacing:0.1em;">RECOMMEND</span>
                <span style="color:#52525b;">ここにあなたへのおすすめ書籍広告を掲載できます</span>
            </div>
        `;
    }
}

function nextQuestion(type) {
    scoreCounts[type]++;
    currentQuestionIndex++;
    renderQuiz();
}

function resetQuiz() {
    currentQuestionIndex = 0;
    scoreCounts = { A: 0, B: 0, C: 0, D: 0 };
    renderQuiz();
}

renderQuiz();
</script>

</body>
</html>
