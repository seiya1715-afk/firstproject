<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE QUOTE ─ 今のあなたを言語化する、言葉の処方箋</title>
    <style>
        :root {
            --bg-top: #0a0a0c;
            --bg-bottom: #16161a;
            --card-bg: rgba(22, 22, 26, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-color: #3b82f6;  
            --primary-glow: rgba(59, 130, 246, 0.3);
            --text-color: #f4f4f5;     
            --sub-text: #71717a;       
            --accent-color: #f43f5e;   
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            letter-spacing: 0.06em;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 45px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h1 { 
            font-size: 2rem; 
            font-weight: 900; 
            margin: 0 0 8px 0; 
            color: var(--text-color); 
            letter-spacing: 0.2em;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--sub-text);
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            box-shadow: 0 0 8px var(--primary-color);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question { 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 35px; 
            text-align: left; 
            line-height: 1.7;
            color: #e4e4e7;
        }

        .options { display: flex; flex-direction: column; gap: 14px; }

        .btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d4d4d8;
            padding: 18px 22px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            text-align: left;
            line-height: 1.5;
            transition: all 0.25s ease;
        }

        .btn:hover {
            background: rgba(59, 130, 246, 0.08);
            border-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
            transform: translateY(-1px);
        }

        .result-title { font-size: 0.8rem; color: var(--sub-text); margin-bottom: 8px; letter-spacing: 0.2em; }
        .result-status { font-size: 1.6rem; font-weight: 800; color: var(--accent-color); margin-bottom: 40px; letter-spacing: 0.05em; }
        
        .quote-box {
            background: rgba(0, 0, 0, 0.2);
            border-left: 2px solid var(--primary-color);
            padding: 30px 25px;
            margin-bottom: 40px;
            text-align: left;
            border-radius: 0 12px 12px 0;
            box-shadow: inset 5px 0 20px rgba(0,0,0,0.2);
        }
        
        .quote-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; line-height: 1.8; color: #ffffff; }
        .quote-author { font-size: 0.85rem; color: var(--sub-text); text-align: right; font-style: italic; }
        
        .retry-btn {
            background: var(--text-color);
            color: var(--bg-top);
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.1em;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .retry-btn:hover {
            background: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 12px 25px rgba(255,255,255,0.1);
        }

        .ad-space {
            margin-top: 45px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.05);
            font-size: 0.75rem;
            color: #52525b;
            border-radius: 8px;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <!-- JavaScriptで動的に入ります -->
</div>

<script>
// 新しくなったエモくて深い5つの質問
const questions = [
    { q: "もし今のあなたの「心の色」を表現するなら、どれが一番近い？", a: ["真っ直ぐに燃える「情熱の赤」", "静かに深く沈む「真夜中の青」", "霧がかかったような「曖昧なグレー」", "周りを優しく照らす「木漏れ日の緑」"], types: ["A", "B", "C", "D"] },
    { q: "ふと立ち止まったとき、あなたの足を引っ張っているものは何だと思う？", a: ["高すぎる目標へのプレッシャー", "身体と心に溜まった、言葉にできない疲れ", "過去の後悔や、未来への漠然とした不安", "周りの目を気にしすぎてしまう自分"], types: ["A", "B", "C", "D"] },
    { q: "夜、静かな部屋。頭の中で鳴り響くのはどんな感情？", a: ["「もっとやれる、次はこうしよう」という焦燥", "「もう何も考えずに眠りたい」という渇望", "「これで合っているのかな」という迷い", "「今日もなんとか乗り切った」という静寂"], types: ["A", "B", "C", "D"] },
    { q: "大切な人が落ち込んでいます。今のあなたがかけたい言葉は？", a: ["「君ならできるよ、応援してる！」", "「無理しないで、今は全部休もう」", "「答えを急がなくていい、一緒に悩もう」", "「そのままの君が、一番素敵だよ」"], types: ["A", "B", "C", "D"] },
    { q: "今、あなたの心が一番求めている「贅沢」はどれ？", a: ["新しい挑戦に飛び込むスリル", "誰にも邪魔されない、圧倒的な深い眠り", "自分の選択に自信を持てる、確かな確信", "誰かに「がんばってるね」と認められること"], types: ["A", "B", "C", "D"] }
];

const quotesDatabase = {
    A: [
        { text: "行動の動機が純粋であれば、結果を恐れる必要はない。", author: "マハトマ・ガンジー" },
        { text: "最大の危険は、目標が高すぎて失敗することではなく、低すぎる目標を達成することだ。", author: "ミケランジェロ" },
        { text: "世界を変えたいなら、まず自分がその変化になりなさい。", author: "ガンジー" }
    ],
    B: [
        { text: "休むことは、次の前進のための準備である。", author: "アントニー・チェーホフ" },
        { text: "何もしない時間を作ることは、心を耕すことと同じだ。", author: "ゲーテ" },
        { text: "飛べないなら走りなさい。走れないなら歩きなさい。歩けないなら這いなさい。とにかく前へ。", author: "キング牧師" }
    ],
    C: [
        { text: "明日は明日、今日は今日。悩んだって始まらないさ。", author: "スナフキン" },
        { text: "未来を予知する最良の方法は、未来を創ることだ。", author: "ピーター・ドラッカー" },
        { text: "心に迷いがあるときは、一番シンプルな道を選びなさい。", author: "アリストテレス" }
    ],
    D: [
        { text: "自分を愛することは、一生続くロマンスの始まりだ。", author: "オスカー・ワイルド" },
        { text: "誰もが完璧ではない。だから鉛筆には消しゴムがついているんだ。", author: "ウォルフ・ガング" },
        { text: "他人の目を気にするな。彼らは君のことなど大して考えていない。", author: "ココ・シャネル" }
    ]
};

const statusTitles = {
    A: "ENERGY // 前進モード",
    B: "RECOVERY // 省エネ休息モード",
    C: "THINKING // 深呼吸モヤモヤモード",
    D: "POKERFACE // がんばり屋モード"
};

let currentQuestionIndex = 0;
let scoreCounts = { A: 0, B: 0, C: 0, D: 0 };

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    
    if (currentQuestionIndex < questions.length) {
        const qData = questions[currentQuestionIndex];
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        
        container.innerHTML = `
            <h1>THE QUOTE</h1>
            <div class="subtitle">WORDS FOR YOUR SOUL</div>
            <div class="progress-bar"><div class="progress" style="width: ${progressPercent}%"></div></div>
            <div class="question">Q${currentQuestionIndex + 1}. ${qData.q}</div>
            <div class="options">
                ${qData.a.map((ans, i) => `<button class="btn" onclick="nextQuestion('${qData.types[i]}')">${ans}</button>`).join('')}
            </div>
            
            <!-- 【広告枠：クイズ途中】 -->
            <div class="ad-space">
                <span style="color:#3f3f46; display:block; margin-bottom:5px; font-weight:700; letter-spacing:0.1em;">SPONSOR LINK</span>
                <span style="color:#52525b;">ここにGoogle AdSense等の広告が入ります</span>
            </div>
        `;
    } else {
        let maxType = 'A';
        let maxCount = 0;
        for (let type in scoreCounts) {
            if (scoreCounts[type] > maxCount) {
                maxCount = scoreCounts[type];
                maxType = type;
            }
        }
        
        const typeQuotes = quotesDatabase[maxType];
        const randomQuote = typeQuotes[Math.floor(Math.random() * typeQuotes.length)];
        
        container.innerHTML = `
            <h1>THE QUOTE</h1>
            <div class="subtitle">DIAGNOSIS COMPLETE</div>
            <div class="result-title">ANALYSIS RESULT</div>
            <div class="result-status">${statusTitles[maxType]}</div>
            
            <div class="quote-box">
                <div class="quote-text">「${randomQuote.text}」</div>
                <div class="quote-author">— ${randomQuote.author}</div>
            </div>
            
            <p style="font-size:0.75rem; color:var(--sub-text); margin-bottom:30px;">※言葉はあなたの運気で変化します。また明日もお越しください。</p>
            <button class="retry-btn" onclick="resetQuiz()">RETRY</button>
            
            <!-- 【広告枠：結果画面】 -->
            <div class="ad-space">
                <span style="color:#3f3f46; display:block; margin-bottom:5px; font-weight:700; letter-spacing:0.1em;">RECOMMEND</span>
                <span style="color:#52525b;">ここにあなたへのおすすめ書籍広告を掲載できます</span>
            </div>
        `;
    }
}

function nextQuestion(type) {
    scoreCounts[type]++;
    currentQuestionIndex++;
    renderQuiz();
}

function resetQuiz() {
    currentQuestionIndex = 0;
    scoreCounts = { A: 0, B: 0, C: 0, D: 0 };
    renderQuiz();
}

renderQuiz();
</script>

</body>
</html>
