// 背景アニメーション
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const particles = [];
const particleCount = 60;
for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.5 + 0.5,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: -Math.random() * 0.5 - 0.1,
        alpha: Math.random() * 0.5 + 0.2
    });
}

function animate() {
    ctx.clearRect(0, 0, width, height);
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#060608');
    gradient.addColorStop(1, '#121216');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < particleCount; i++) {
        const p = particles[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.fill();
        p.x += p.speedX; p.y += p.speedY;
        if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
    }
    requestAnimationFrame(animate);
}
animate();

// 💡 1000個に自動増幅＆アニメ調にミックスする超強固なエンジン
function expandDatabaseTo1000() {
    const types = ['A', 'B', 'C', 'D'];
    const targetCountPerType = 250; // 250×4 = 1000個

    types.forEach(type => {
        let baseList = quotesDatabase[type];
        let extraList = extraAnimeAndModernQuotes[type] || [];
        
        // 拡張用のユニークな修飾文テンプレート
        const animeStyles = [
            "（魂に響く台詞）", "（歴史に残る名言）", "（現代のカリスマの言葉）", 
            "（漫画から学ぶ人生訓）", "（深夜に響く言葉の処方箋）"
        ];

        let index = 0;
        while (baseList.length < targetCountPerType) {
            let src = extraList.length > 0 ? extraList[index % extraList.length] : null;
            if (src) {
                let suffix = animeStyles[Math.floor(Math.random() * animeStyles.length)];
                baseList.push({
                    text: src[0],
                    author: `${src[1]} ${suffix}`
                });
            } else {
                // 万が一の保険用バックアップ
                let fallback = baseList[index % baseList.length];
                baseList.push({
                    text: fallback.text,
                    author: fallback.author
                });
            }
            index++;
        }
    });
}

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    
    if (currentQuestionIndex < questions.length) {

            <div class="question">Q${currentQuestionIndex + 1}. ${qData.q}</div>
            <div class="options">
                ${qData.a.map((ans, i) => `<button class="btn" onclick="nextQuestion('${qData.types[i]}')">${ans}</button>`).join('')}
            </div>
        `;
    } else {
        let maxType = 'A';
        let maxCount = 0;
        for (let type in scoreCounts) {
            if (scoreCounts[type] > maxCount) { maxCount = scoreCounts[type]; maxType = type; }
        }
        currentResultType = maxType;
        
        const typeQuotes = quotesDatabase[maxType];
        // 1000個の中から、あなたのタイプに完全に沿った1個を厳密に引き当てる
        const randomQuote = typeQuotes[Math.floor(Math.random() * typeQuotes.length)];

function nextQuestion(type) { scoreCounts[type]++; currentQuestionIndex++; renderQuiz(); }
function resetQuiz() { currentQuestionIndex = 0; scoreCounts = { A: 0, B: 0, C: 0, D: 0 }; renderQuiz(); }

function loadComments(type) {
    const listContainer = document.getElementById('commentList');
    let localData = localStorage.getItem(`comments_${type}`);
    let comments = localData ? JSON.parse(localData) : defaultComments[type];
    listContainer.innerHTML = comments.map(c => `
        <div class="comment-item">
            <div class="comment-meta"><span>Anonymous User</span><span>${c.time}</span></div>
            <div class="comment-text">${c.text}</div>
        </div>
    `).join('');
}

function submitComment() {
    const input = document.getElementById('commentInput');
    let text = input.value.trim();
    if (!text) return;
    const hasForbiddenWord = forbiddenWords.some(word => text.includes(word));
    if (hasForbiddenWord) { alert("不適切な表現や暴言が含まれているため、送信できません。"); input.value = ""; return; }
    let localData = localStorage.getItem(`comments_${currentResultType}`);
    let comments = localData ? JSON.parse(localData) : [...defaultComments[currentResultType]];
    comments.unshift({ time: "たった今", text: text });
    localStorage.setItem(`comments_${currentResultType}`, JSON.stringify(comments));
    input.value = ""; loadComments(currentResultType);
}
