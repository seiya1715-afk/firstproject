<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE QUOTE ─ 今のあなたを言語化する、言葉の処方箋</title>
    <style>
        :root {
            --card-bg: rgba(15, 15, 20, 0.65);
            --card-border: rgba(255, 255, 255, 0.06);
            --primary-color: #3b82f6;  
            --text-color: #f4f4f5;     
            --sub-text: #71717a;       
            --accent-color: #f43f5e;   
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #030303;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            letter-spacing: 0.06em;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 45px 35px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 { 
            font-size: 2.2rem; 
            font-weight: 900; 
            margin: 0 0 2px 0; 
            color: var(--text-color); 
            letter-spacing: 0.25em;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .katakana-title {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--primary-color);
            letter-spacing: 0.4em; 
            margin-bottom: 25px;
            text-indent: 0.4em; 
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--sub-text);
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            box-shadow: 0 0 12px var(--primary-color);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question { 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 35px; 
            text-align: left; 
            line-height: 1.8;
            color: #e4e4e7;
        }

        .options { display: flex; flex-direction: column; gap: 14px; }

        .btn {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #d4d4d8;
            padding: 18px 22px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.95rem;
            text-align: left;
            line-height: 1.5;
            transition: all 0.25s ease;
        }

        .btn:hover {
            background: rgba(59, 130, 246, 0.06);
            border-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
            transform: translateY(-1px);
        }

        .result-title { font-size: 0.8rem; color: var(--sub-text); margin-bottom: 8px; letter-spacing: 0.2em; }
        .result-status { font-size: 1.6rem; font-weight: 800; color: var(--accent-color); margin-bottom: 40px; letter-spacing: 0.05em; }
        
        .quote-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 2px solid var(--primary-color);
            padding: 30px 25px;
            margin-bottom: 40px;
            text-align: left;
            border-radius: 0 14px 14px 0;
            box-shadow: inset 5px 0 30px rgba(0,0,0,0.3);
        }
        
        .quote-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; line-height: 1.8; color: #ffffff; }
        .quote-author { font-size: 0.85rem; color: var(--sub-text); text-align: right; font-style: italic; }
        
        .retry-btn {
            background: var(--text-color);
            color: #000000;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.1em;
            transition: all 0.2s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .retry-btn:hover {
            background: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 12px 30px rgba(255,255,255,0.15);
        }

        .comments-section {
            margin-top: 40px;
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 30px;
        }

        .comments-section h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #e4e4e7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comment-input-wrap {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .comment-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .comment-input:focus { border-color: var(--primary-color); }

        .comment-submit {
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 15px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .comment-submit:hover { background: #2563eb; }

        .comment-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .comment-list::-webkit-scrollbar { width: 4px; }
        .comment-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }

        .comment-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .comment-meta {
            font-size: 0.7rem;
            color: var(--sub-text);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .comment-text { color: #d4d4d8; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container" id="quiz-container">
    </div>

<script>
// 背景アニメーション
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const particles = [];
const particleCount = 60;
for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.5 + 0.5,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: -Math.random() * 0.5 - 0.1,
        alpha: Math.random() * 0.5 + 0.2
    });
}

function animate() {
    ctx.clearRect(0, 0, width, height);
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#060608');
    gradient.addColorStop(1, '#121216');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < particleCount; i++) {
        const p = particles[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.fill();
        p.x += p.speedX; p.y += p.speedY;
        if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
    }
    requestAnimationFrame(animate);
}
animate();

// クイズデータ
const questions = [
    { q: "今のあなたの「HP（残りエネルギー）」をスマホの充電に例えると？", a: ["80%以上！まだまだ余裕で動ける", "20%以下…早く家で充電（帰宅）したい", "50%前後。色々と考えて頭が重い感じ", "充電マークは緑だけど、実は低電力モード"], types: ["A", "B", "C", "D"] },
    { q: "目の前に「1時間、完全に自由に使える空き時間」ができたら？", a: ["やりたかった趣味や作業を進める", "ベッドに倒れ込んでSNSをぼーっと眺める", "今後のスケジュールや仕事の整理をする", "美味しいものを食べるか、お風呂にこもる"], types: ["A", "B", "C", "D"] },
    { q: "SNSを見ていて、なんとなく「モヤッ」とする瞬間は？", a: ["周りがどんどん成果を出して焦るとき", "みんな楽しそうで、自分の日常が地味に見えるとき", "色んな人の愚痴や議論が目に入ってくるとき", "「いいね」の数がなんとなく気になるとき"], types: ["A", "B", "C", "D"] },
    { q: "友達から「最近ちょっと疲れてない？」と心配されたら？", a: ["「全然！めっちゃ元気！」と笑顔で返す", "「そうなの、実は最近バタバタで…」とこぼす", "「え、そんな風に見える？」と理由を気にする", "「大丈夫だよ〜」と笑って話を流す"], types: ["A", "B", "C", "D"] },
    { q: "今、一番「言われたら嬉しい言葉」はどれ？", a: ["「君なら絶対にできるよ！」（応援）", "「もう十分がんばったから休みな」（甘やかし）", "「焦らなくていい、マイペースでいこう」（安心）", "「いつも本当にありがとう」（感謝・肯定）"], types: ["A", "B", "C", "D"] }
];

const forbiddenWords = ["死ね", "バカ", "馬鹿", "下手", "キモい", "きもい", "殺す", "ゴミ", "クズ", "カス", "アホ", "うんこ"];

const quotesDatabase = {
    A: [
        { text: "ハングリーであれ。愚かであれ。", author: "スティーブ・ジョブズ" },
        { text: "世の中には2種類の男しかいない。俺か、俺以外か。", author: "ROLAND" },
        { text: "壁というのは、超えられる可能性がある人にしかやってこない。", author: "イチロー" },
        { text: "やれるかやれないかではなく、やるかやらないか。", author: "大谷翔平" },
        { text: "夢は逃げない。逃げるのはいつも自分だ。", author: "高橋歩" },
        { text: "特別なことをするために特別なことをするのではない。普段どおりの当たり前のことをする。", author: "木村拓哉" },
        { text: "お前の道を進め、人にはその言い分を許しておけ。", author: "ダンテ" },
        { text: "あきらめたらそこで試合終了だよ。", author: "安西先生" },
        { text: "配られたカードで勝負するしかないのさ。", author: "スヌーピー" },
        { text: "挑戦を止めたとき、本当の失敗が始まる。", author: "現代の起業家" }
    ],
    B: [
        { text: "休むことは、次の前進のための準備である。", author: "アントニー・チェーホフ" },
        { text: "だるい時はね、だるいまままがいいんだよ。無理にシャキッとしようとするから疲れるの。", author: "スナフキン" },
        { text: "死ぬこと以外かすり傷。", author: "現代の格言" },
        { text: "ウチら地球に留学しにきてるだけだから、そんな重く考えなくてよくね？", author: "kemio" },
        { text: "無理して笑うなよ。疲れるだろ。", author: "マツコ・デラックス" },
        { text: "人間、そんなに簡単には壊れないけれど、壊れる前に逃げるのは恥じゃない。", author: "ひろゆき" },
        { text: "砂漠が美しいのは、どこかに井戸を隠しているからだよ。", author: "サン＝テグジュペリ" },
        { text: "長い間、じっと座って海を眺めていると、時々大切なことを思い出すよ。", author: "ムーミントロール" },
        { text: "何もしない時間を作ることは、心を耕すことと同じだ。", author: "ゲーテ" },
        { text: "まあ、なんとかなるでしょ。明日は明日の風が吹く。", author: "ゆるミニマリスト" }
    ],
    C: [
        { text: "明日は明日、今日は今日。悩んだって始まらないさ。", author: "スナフキン" },
        { text: "未来を予知する最良の方法は、未来を創ることだ。", author: "ピーター・ドラッカー" },
        { text: "人生に正解なんてない。自分が選んだ道を正解にしていくしかないんだよ。", author: "星野源" },
        { text: "他人の正解が、自分の正解とは限らない。", author: "現代のアーティスト" },
        { text: "下を向いていたら、虹を見つけることは出来ないよ。", author: "チャールズ・チャップリン" },
        { text: "一度きりの人生、他人の人生を生きる時間は1秒もない。", author: "スティーブ・ジョブズ" },
        { text: "面白きこともなき世を面白く、すみなすものは心なりけり。", author: "高杉晋作" },
        { text: "心に迷いがあるときは、一番シンプルな道を選びなさい。", author: "アリストテレス" },
        { text: "本当に大切なものはね、目に見えないんだよ。", author: "サン＝テグジュペリ" },
        { text: "映画の後味のように、悩む時間もきっと人生のスパイスになる。", author: "シネマエッセイスト" }
    ],
    D: [
        { text: "自分を愛することは、一生続くロマンスの始まりだ。", author: "オスカー・ワイルド" },
        { text: "他人の目を気にするな。彼らは君のことなど大して考えていない。", author: "ココ・シャネル" },
        { text: "自分をよく見せようとするのをやめたとき、いちばん自分らしくなれる。", author: "宇多田ヒカル" },
        { text: "他人にどう思われるかより、自分がどうありたいか。", author: "マツコ・デラックス" },
        { text: "いい子でいようとするのをやめると、人生は一気にイージーモードになるよ。", author: "ひろゆき" },
        { text: "誰もが完璧ではない。だから鉛筆には消しゴムがついているんだ。", author: "ウォルフ・ガング" },
        { text: "人と違った生き方をしてる人間を、普通の物差しで測っちゃいけないよ。", author: "スナフキン" },
        { text: "他人の期待に応えるために、自分の人生を犠牲にする必要はない。", author: "アドラー" },
        { text: "私の価値は、他人が決めるものではない。私が決めるものだ。", author: "レディー・ガガ" },
        { text: "完璧なお面を被るよりも、ちょっと不器用な素顔のほうが愛されるよ。", author: "エッセイスト" }
    ]
};

// 200個拡張ロジック
for (let key in quotesDatabase) {
    const baseLength = quotesDatabase[key].length;
    while (quotesDatabase[key].length < 50) {
        const randomBase = quotesDatabase[key][Math.floor(Math.random() * baseLength)];
        quotesDatabase[key].push({ text: randomBase.text, author: randomBase.author });
    }
}

const statusTitles = {
    A: "ENERGY // 前進モード", B: "RECOVERY // 省エネ休息モード", C: "THINKING // 深呼吸モヤモヤモード", D: "POKERFACE // がんばり屋モード"
};

const defaultComments = {
    A: [{time:"10分前", text:"めっちゃエネルギー出た！大谷の名言最高すぎ"}, {time:"1時間前", text:"やる気全開になったわ、今日から頑張る"}],
    B: [{time:"5分前", text:"スナフキンの言葉染みる…まじで今日は寝ます"}, {time:"32分前", text:"充電15%だったから救われたわ"}],
    C: [{time:"3分前", text:"星野源の言葉に救われた。正解なんてないよね"}, {time:"2時間前", text:"最近ずっとモヤモヤしてたから泣きそう"}],
    D: [{time:"12分前", text:"宇多田ヒカル出た！他人の目気にせず生きる！"}, {time:"45分前", text:"ポーカーフェイス見抜かれてて草"}]
};

let currentQuestionIndex = 0;
let scoreCounts = { A: 0, B: 0, C: 0, D: 0 };
let currentResultType = 'A';

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    
    if (currentQuestionIndex < questions.length) {
        const qData = questions[currentQuestionIndex];
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        
        container.innerHTML = `
            <h1>THE QUOTE</h1>
            <div class="katakana-title">─ ザ・クォート ─</div>
            <div class="subtitle">WORDS FOR YOUR SOUL</div>
            <div class="progress-bar"><div class="progress" style="width: ${progressPercent}%"></div></div>
            <div class="question">Q${currentQuestionIndex + 1}. ${qData.q}</div>
            <div class="options">
                ${qData.a.map((ans, i) => `<button class="btn" onclick="nextQuestion('${qData.types[i]}')">${ans}</button>`).join('')}
            </div>
        `;
    } else {
        let maxType = 'A';
        let maxCount = 0;
        for (let type in scoreCounts) {
            if (scoreCounts[type] > maxCount) { maxCount = scoreCounts[type]; maxType = type; }
        }
        currentResultType = maxType;
        
        const typeQuotes = quotesDatabase[maxType];
        const randomQuote = typeQuotes[Math.floor(Math.random() * typeQuotes.length)];
        
        container.innerHTML = `
            <h1>THE QUOTE</h1>
            <div class="katakana-title">─ ザ・クォート ─</div>
            <div class="subtitle">DIAGNOSIS COMPLETE</div>
            <div class="result-title">ANALYSIS RESULT</div>
            <div class="result-status">${statusTitles[maxType]}</div>
            
            <div class="quote-box">
                <div class="quote-text">「${randomQuote.text}」</div>
                <div class="quote-author">— ${randomQuote.author}</div>
            </div>
            
            <button class="retry-btn" onclick="resetQuiz()">RETRY</button>
            
            <div class="comments-section">
                <h3>💬 みんなの感想 <span>同タイプの結果一覧</span></h3>
                <div class="comment-input-wrap">
                    <input type="text" id="commentInput" class="comment-input" placeholder="暴言・NGワードは非表示になります..." maxlength="50">
                    <button class="comment-submit" onclick="submitComment()">送信</button>
                </div>
                <div id="commentList" class="comment-list"></div>
            </div>
        `;
        loadComments(maxType);
    }
}

function nextQuestion(type) { scoreCounts[type]++; currentQuestionIndex++; renderQuiz(); }
function resetQuiz() { currentQuestionIndex = 0; scoreCounts = { A: 0, B: 0, C: 0, D: 0 }; renderQuiz(); }

function loadComments(type) {
    const listContainer = document.getElementById('commentList');
    let localData = localStorage.getItem(`comments_${type}`);
    let comments = localData ? JSON.parse(localData) : defaultComments[type];
    listContainer.innerHTML = comments.map(c => `
        <div class="comment-item">
            <div class="comment-meta"><span>Anonymous User</span><span>${c.time}</span></div>
            <div class="comment-text">${c.text}</div>
        </div>
    `).join('');
}

function submitComment() {
    const input = document.getElementById('commentInput');
    let text = input.value.trim();
    if (!text) return;
    const hasForbiddenWord = forbiddenWords.some(word => text.includes(word));
    if (hasForbiddenWord) { alert("不適切な表現や暴言が含まれているため、送信できません。"); input.value = ""; return; }
    let localData = localStorage.getItem(`comments_${currentResultType}`);
    let comments = localData ? JSON.parse(localData) : [...defaultComments[currentResultType]];
    comments.unshift({ time: "たった今", text: text });
    localStorage.setItem(`comments_${currentResultType}`, JSON.stringify(comments));
    input.value = ""; loadComments(currentResultType);
}

renderQuiz();
</script>

</body>
</html>
